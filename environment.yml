# conda environment for foldrescue.
#
# RDKit is the reason this file exists: it is far less painful from conda-forge
# than from PyPI on some platforms. Everything else would install cleanly with
# pip alone.
#
# Tier 2 (torch/transformers) is commented out by default. It is a multi-GB
# install and two of the three model tiers do not need it -- uncomment if you
# intend to run the representation-fusion tier.
name: foldrescue
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.14
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - lightgbm>=4.0
  - rdkit>=2023.03.1
  - shap>=0.44
  - psutil>=5.9
  - matplotlib>=3.7
  - jupyter
  - nbclient
  - nbformat
  - ipykernel
  - pytest>=7.4
  - pip
  - pip:
      - ruff>=0.4
      # --- Tier 2 (representation fusion) ---------------------------------
      # - torch>=2.0
      # - transformers>=4.30
