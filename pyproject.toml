[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foldrescue"
version = "0.1.0.dev0"
description = "Pair-level prediction of pharmacological chaperone rescue for destabilising missense variants, with calibration and an explicit applicability domain."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "foldrescue contributors" }]
keywords = [
  "pharmacological chaperone", "missense variant", "protein stability",
  "calibration", "applicability domain", "conformal prediction",
  "cheminformatics", "lysosomal storage disease",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]

# Tier 1 / Tier 3, calibration, the applicability domain and the CLI all run on
# these alone. Tier 2 needs the optional 'fusion' extra.
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "rdkit>=2023.3.1",
  "shap>=0.44",
  "psutil>=5.9",
]

[project.optional-dependencies]
# Tier 2 only. Kept optional because torch is a large dependency and two of the
# three tiers do not need it.
fusion = ["torch>=2.0", "transformers>=4.30"]
cookbook = ["matplotlib>=3.7", "jupyter", "nbclient", "nbformat", "ipykernel"]
dev = ["pytest>=7.4", "pytest-cov", "ruff>=0.4"]
all = [
  "torch>=2.0", "transformers>=4.30",
  "matplotlib>=3.7", "jupyter", "nbclient", "nbformat", "ipykernel",
  "pytest>=7.4", "pytest-cov", "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/xX-its-amit-Xx/foldrescue"
Repository = "https://github.com/xX-its-amit-Xx/foldrescue"
Issues = "https://github.com/xX-its-amit-Xx/foldrescue/issues"

[project.scripts]
foldrescue = "foldrescue.cli:main"

[tool.setuptools]
packages = ["foldrescue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning:lightgbm.*",
  "ignore::UserWarning:shap.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",    # long lines occur in explanatory docstrings, which are the point
  "B008",
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
